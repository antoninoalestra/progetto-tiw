<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrati a Qotly - Gestione Spese di Gruppo</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/auth.css">
</head>
<body>
  <div class="auth-layout">
    
    <!-- Left side: Brand -->
    <div class="auth-brand-side animate-in">
      <div class="brand-logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Qotly
      </div>
      <div class="brand-content">
        <h1>Dividi le spese.<br>Non le amicizie.</h1>
        <div class="brand-features">
          <div class="feature-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            Tieni traccia delle spese condivise
          </div>
          <div class="feature-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            Crea gruppi infiniti
          </div>
          <div class="feature-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            Bilanci calcolati istantaneamente
          </div>
        </div>
      </div>
      <div style="opacity: 0.8; font-size: 14px;">© 2026 Qotly. All rights reserved.</div>
    </div>

    <!-- Right side: Form -->
    <div class="auth-form-side animate-in" style="animation-delay: 100ms;">
      <div class="form-wrapper">
        
        <div class="mobile-brand">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          <h1 style="margin-top: 8px;">Qotly</h1>
        </div>

        <h2>Crea un account</h2>
        <p>Unisciti a Qotly per gestire le tue spese di gruppo.</p>
        
        <form id="registerForm">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="floating-label-group">
              <input type="text" id="nome" name="nome" class="input" required placeholder=" ">
              <label for="nome">Nome</label>
            </div>
            <div class="floating-label-group">
              <input type="text" id="cognome" name="cognome" class="input" placeholder=" ">
              <label for="cognome">Cognome</label>
            </div>
          </div>

          <div class="floating-label-group">
            <input type="email" id="email" name="email" class="input" required placeholder=" ">
            <label for="email">Indirizzo Email</label>
          </div>

          <div class="floating-label-group" style="position: relative;">
            <input type="password" id="password" name="password" class="input" required placeholder=" ">
            <label for="password">Password</label>
            <button type="button" class="password-toggle" onclick="togglePassword('password')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; height: 48px; font-size: 16px;">Registrati ora</button>
        </form>
        
        <div class="auth-links">
          Hai già un account? <a href="login.html">Accedi qui</a>
        </div>
      </div>
    </div>

  </div>

  <script>
    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
      } else {
        input.type = 'password';
      }
    }
  </script>
  <script type="module" src="../js/ui/toast.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js" type="module"></script>
</body>
</html>
