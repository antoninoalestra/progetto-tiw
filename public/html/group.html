<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dettaglio Gruppo</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* Layout a due colonne per schermi grandi */
    .group-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }

    .group-section {
      flex: 1;
      min-width: 300px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .expense-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
    }

    .expense-item:last-child {
      border-bottom: none;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      text-decoration: none;
      color: #333;
      border: 1px solid #333;
      padding: 5px 10px;
      border-radius: 4px;
    }

    .back-btn:hover {
      background-color: #f0f0f0;
    }

    /* Form styling basic */
    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }

    button[type="submit"] {
      padding: 10px 15px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button[type="submit"]:hover {
      background-color: #0056b3;
    }

    /* Stile per i bottoni "Salda" */
    .settle-btn {
      padding: 5px 10px;
      margin-left: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
    }

    .settle-btn:hover {
      background-color: #218838;
    }

    .settlement-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .settlement-item:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="#" id="backToDashboard" class="back-btn">&larr; Torna alla Dashboard</a>

    <h1 id="group-title">Caricamento Gruppo...</h1>

    <div class="group-container">
      <!-- Sezione 1: Aggiungi Spesa -->
      <div class="group-section">
        <h2>Aggiungi Spesa</h2>
        <form id="add-expense-form">
          <div class="form-group">
            <label for="description">Descrizione:</label>
            <input type="text" id="description" name="description" required placeholder="Es: Cena in pizzeria">
          </div>
          <div class="form-group">
            <label for="amount">Importo Totale (€):</label>
            <input type="number" id="amount" name="amount" step="0.01" min="0.01" required placeholder="0.00">
          </div>
          <div class="form-group">
            <label for="payer">Chi ha pagato?</label>
            <select id="payer" name="payerId" required>
              <option value="">-- Seleziona un membro --</option>
              <!-- Popolato dinamicamente da JS -->
            </select>
          </div>
          <button type="submit">Salva Spesa</button>
        </form>
        <p id="expense-message" style="margin-top: 10px; color: red;"></p>
      </div>

      <!-- Sezione 2: Lista Spese -->
      <div class="group-section">
        <h2>Storico Spese</h2>
        <div id="expenses-list">
          <p>Caricamento spese...</p>
        </div>
      </div>

      <!-- Sezione 3: Rimborsi Suggeriti -->
      <div class="group-section">
        <h2>Rimborsi Suggeriti</h2>
        <div id="suggested-settlements-list">
          <p>Nessun rimborso da calcolare al momento.</p>
        </div>
      </div>

      <!-- Sezione 4: Storico Rimborsi -->
      <div class="group-section">
        <h2>Storico Rimborsi</h2>
        <div id="past-settlements-list">
          <p>Nessun rimborso effettuato finora.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/group.js"></script>
</body>
</html>
