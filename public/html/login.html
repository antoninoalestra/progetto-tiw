<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accedi a Qotly - Gestione Spese di Gruppo</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body style="padding-top: 0;">
  <div class="auth-wrapper">
    <div class="form-container">
      <div class="auth-brand">
        <div class="logo">Qotly</div>
        <p>Condividi le spese, non le preoccupazioni.</p>
      </div>
      
      <form id="loginForm">
        <label for="email">Indirizzo Email</label>
        <input type="email" id="email" name="email" required placeholder="Inserisci la tua email">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Inserisci la tua password">

        <button type="submit" style="margin-top: 0.5rem; width: 100%;">Accedi</button>
      </form>
      
      <div class="links">
        Non hai ancora un account? <a href="register.html">Registrati qui</a>
      </div>
    </div>
  </div>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js" type="module"></script>
</body>
</html>
